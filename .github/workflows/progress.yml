name: Decompilation progress
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install pefile==2024.8.26
      - name: Generate conservative objdiff report
        run: python tools/decomp_dev_report.py --out build/report.json
      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: de_1.0_report
          path: build/report.json
          if-no-files-found: error
          retention-days: 90
